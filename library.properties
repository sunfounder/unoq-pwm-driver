name=UNOQ_PWMServoDriver
version=1.0.0
author=SunFounder
maintainer=SunFounder
sentence=A PWM pin driver for the Arduino UNO Q, by SunFounder.
paragraph=Drives PWM on every UNO Q header pin: the 13 pins wired to an STM32 timer channel use hardware PWM (exact frequency, 1 us pulse resolution, no CPU cost), and the remaining 9 pins fall back to a k_timer driven software PWM engine at 100 us resolution. Also drives the two MCU-side on-board RGB LEDs, one of which is PWM dimmable only thanks to the software engine. The public API mirrors Adafruit_PWMServoDriver, plus a HardwareServo-compatible servo class and an RGB helper.
category=Device Control
url=https://www.sunfounder.com
architectures=zephyr
includes=UNOQ_PWMServoDriver.h,UNOQ_PWMServo.h,UNOQ_PWMRGB.h
