name=HardwareAnalogWrite
version=1.0.0
author=SunFounder
maintainer=SunFounder
sentence=analogWrite() on every pin of the Arduino UNO Q, with a frequency you can choose.
paragraph=The Arduino Zephyr core's analogWrite() only reaches pins wired to an STM32 timer channel and falls back to plain digital on/off everywhere else. This library drives every GPIO with real PWM: the 16 timer-backed channels use hardware PWM, and the remaining pins are served by a software engine built on a Zephyr k_timer, so D0, D1, D4 and A0-A5 fade and dim properly. It also adds analogWriteFrequency(), which the core does not offer, because the PWM period is otherwise frozen by the devicetree. Analog output is 8 bit (0-255), matching analogWrite(), and analogWritePin() reports success or failure instead of silently giving up. A servo class with the Arduino_HardwareServo interface is included.
category=Device Control
url=https://www.sunfounder.com
