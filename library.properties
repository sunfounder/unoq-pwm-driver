name=UNOQ_PWMServoDriver
version=1.0.0
author=arduino
maintainer=arduino <arduino@localhost>
sentence=Full-pin PWM / servo driver for the Arduino UNO Q (STM32U585).
paragraph=Drives PWM on EVERY Arduino pin of the UNO Q. Pins wired to a timer channel use hardware PWM (exact frequency, 1 us pulse resolution); every other GPIO falls back to a k_timer driven software PWM engine. The public API mirrors Adafruit_PWMServoDriver, plus a HardwareServo-compatible servo class.
category=Device Control
url=https://github.com/arduino-libraries/Arduino_HardwareServo
architectures=zephyr
includes=UNOQ_PWMServoDriver.h,UNOQ_PWMServo.h
